name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest tests/test_desk_store.py tests/test_desk_backlog.py tests/test_desk_discussion.py tests/test_desk_discussion_worker.py tests/test_desk_discussion_ui.py tests/test_desk_observer.py tests/test_desk_view.py tests/test_desk_view_performance.py tests/test_desk_freshness.py tests/test_desk_overview.py tests/test_desk_cli.py tests/test_desk_runtime.py tests/test_desk_upgrade.py tests/test_decision_context.py tests/test_decision_context_cli.py tests/test_desk_decision_details.py tests/test_handles.py tests/test_handle_integration.py tests/test_handle_lookup.py tests/test_claude_resolve_ambiguity.py tests/test_desk_notifications.py tests/test_conversation_view.py tests/test_deletion.py tests/test_deletion_provider_schemas.py tests/test_deletion_current.py tests/test_deletion_native.py tests/test_reopen_memory.py -q -p no:cacheprovider
      - run: sessions --version
      - run: ses --version
      - run: sessions --list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: an unrelated pull request should not go red because ruff
      # shipped a new rule or changed its formatting the day it ran.
      - run: python -m pip install ruff==0.16.3
      - run: ruff check .
      - run: ruff format --check .

  claude-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --global @anthropic-ai/claude-code@2.1.329
      - run: claude plugin validate plugins/compact-messages
      - run: claude plugin test plugins/compact-messages
